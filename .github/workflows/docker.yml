# Builds the latest upstream HKUDS/nanobot tag into ghcr.io daily for amd64
# and arm64, per-arch tags merged into one multi-arch tag. Skips already-built
# tags via a manifest check. Note: GitHub disables scheduled workflows after
# 60 days of repo inactivity — re-enable under Settings > Actions if the cron
# quietly stops.

name: docker

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: HKUDS/nanobot

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.check.outputs.image }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          fetch-depth: 0

      - name: Resolve and check out latest tag
        id: tag
        run: |
          tag=$(git describe --tags --abbrev=0)
          git checkout -q "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check if already built
        id: check
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          image=$(tr 'A-Z' 'a-z' <<<"${{ github.repository }}")
          echo "image=ghcr.io/$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "ghcr.io/$image:$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract arch suffix
        id: arch
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "arch=${PLATFORM#*/}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}-${{ steps.arch.outputs.arch }}
            ${{ needs.resolve.outputs.image }}:latest-${{ steps.arch.outputs.arch }}
          build-args: NANOBOT_CHANNELS=telegram
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Merge platform tags
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
